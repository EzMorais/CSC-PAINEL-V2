# Reverse proxy com TLS para as 9 aplicações. Ver DEPLOY.md na raiz do repositório para o
# roteiro completo (troque SEUDOMINIO.com.br pelo domínio real antes de subir).
#
# Os sistemas com login único (Portal, Painel de Locação, RH, Almoxarifado, Programação,
# Alojamentos, o binário Go e — desde 2026-08-11 — Frota) ficam no MESMO domínio
# "sistemas.SEUDOMINIO.com.br", cada um numa porta diferente — é assim que o cookie de
# sessão do Portal vale em todos eles (cookie sem domínio explícito é por HOST, não por
# porta; hosts diferentes quebrariam o login único). Frota deixou de ter subdomínio e login
# próprios quando entrou pro grupo — antes disso ele vivia em frota.SEUDOMINIO.com.br:443
# justamente porque tinha AUTH_SECRET e cookie separados.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  client_max_body_size 25m;
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Porta 80: valida o certificado (ACME) e redireciona o resto pra HTTPS.
  server {
    listen 80;
    server_name sistemas.SEUDOMINIO.com.br;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ---------- Grupo de login único — mesmo host, uma porta por sistema ----------

  server {
    listen 3004 ssl;
    server_name sistemas.SEUDOMINIO.com.br;
    ssl_certificate     /etc/letsencrypt/live/sistemas.SEUDOMINIO.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sistemas.SEUDOMINIO.com.br/privkey.pem;

    location / {
      proxy_pass http://portal:3004;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }

  server {
    listen 3000 ssl;
    server_name sistemas.SEUDOMINIO.com.br;
    ssl_certificate     /etc/letsencrypt/live/sistemas.SEUDOMINIO.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sistemas.SEUDOMINIO.com.br/privkey.pem;

    location / {
      proxy_pass http://painel-locacao:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }

  server {
    listen 3002 ssl;
    server_name sistemas.SEUDOMINIO.com.br;
    ssl_certificate     /etc/letsencrypt/live/sistemas.SEUDOMINIO.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sistemas.SEUDOMINIO.com.br/privkey.pem;

    location / {
      proxy_pass http://rh:3002;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }

  server {
    listen 3003 ssl;
    server_name sistemas.SEUDOMINIO.com.br;
    ssl_certificate     /etc/letsencrypt/live/sistemas.SEUDOMINIO.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sistemas.SEUDOMINIO.com.br/privkey.pem;

    location / {
      proxy_pass http://estoque:3003;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }

  server {
    listen 3007 ssl;
    server_name sistemas.SEUDOMINIO.com.br;
    ssl_certificate     /etc/letsencrypt/live/sistemas.SEUDOMINIO.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sistemas.SEUDOMINIO.com.br/privkey.pem;

    location / {
      proxy_pass http://programacao:3007;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }

  server {
    listen 3005 ssl;
    server_name sistemas.SEUDOMINIO.com.br;
    ssl_certificate     /etc/letsencrypt/live/sistemas.SEUDOMINIO.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sistemas.SEUDOMINIO.com.br/privkey.pem;

    location / {
      proxy_pass http://alojamentos:3005;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }

  server {
    listen 3010 ssl;
    server_name sistemas.SEUDOMINIO.com.br;
    ssl_certificate     /etc/letsencrypt/live/sistemas.SEUDOMINIO.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sistemas.SEUDOMINIO.com.br/privkey.pem;

    location / {
      proxy_pass http://migracao-go:3010;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }

  server {
    listen 3006 ssl;
    server_name sistemas.SEUDOMINIO.com.br;
    ssl_certificate     /etc/letsencrypt/live/sistemas.SEUDOMINIO.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sistemas.SEUDOMINIO.com.br/privkey.pem;

    location / {
      proxy_pass http://frota:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
