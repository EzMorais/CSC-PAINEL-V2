# Gateway público único do ERP. O Nginx só expõe HTTPS; o binário Go recebe todas as
# ramificações e encaminha /frota, /cadastros, /programacao e /whatsapp para os poucos serviços ainda
# externos durante a migração gradual.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  client_max_body_size 25m;
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Mantida apenas para desafio ACME e redirecionamento para a porta pública HTTPS.
  server {
    listen 80;
    server_name sistemas.SEUDOMINIO.com.br;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    server_name sistemas.SEUDOMINIO.com.br;
    ssl_certificate     /etc/letsencrypt/live/sistemas.SEUDOMINIO.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sistemas.SEUDOMINIO.com.br/privkey.pem;

    # Toda a árvore de URLs chega ao gateway Go na mesma porta pública.
    location / {
      proxy_pass http://migracao-go:3010;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
