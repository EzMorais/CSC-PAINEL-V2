# Config temporária, só para o primeiro certificado (ver "Passo 6" do DEPLOY.md).
#
# O nginx.conf definitivo já espera um certificado em /etc/letsencrypt/live/... — mas esse
# certificado só existe DEPOIS que o certbot conseguir validar o domínio via HTTP, então o
# nginx não pode subir com a config final antes de o certificado existir. Este arquivo é o
# "ovo antes da galinha": só HTTP, só o suficiente para o certbot validar.

events {
  worker_connections 1024;
}

http {
  server {
    listen 80;
    server_name sistemas.SEUDOMINIO.com.br frota.SEUDOMINIO.com.br;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }
  }
}
