# Orquestra as 8 aplicações num único VPS. Ver DEPLOY.md na raiz do repositório para o
# roteiro completo (DNS, .env de cada app, HTTPS, comandos).
#
# Por que o Painel, RH, Almoxarifado, Programação, Alojamentos e Portal não ganham cada um
# uma URL bonita: o login único (SSO) deles funciona por COOKIE, e cookie sem domínio
# explícito vale para o mesmo HOST, em qualquer porta — mas não atravessa hosts diferentes.
# Colocar cada um num subdomínio quebraria o "loga uma vez, circula em todos". Por isso os
# seis continuam no mesmo domínio, diferenciados por porta, exatamente como em
# desenvolvimento. Frota e WhatsApp são sistemas à parte (login próprio / sem UI pública) e
# não têm essa restrição.

name: csc-painel

services:
  # Os "args" abaixo (iguais nos 6 serviços de login único) vêm do ".env" na raiz do
  # projeto — não confundir com o "env_file" de cada um, que só vale em tempo de execução.
  # O Next.js precisa desses valores JÁ NO BUILD porque eles são gravados dentro do
  # JavaScript que vai pro navegador (ver DEPLOY.md e .env.example).
  portal:
    build:
      context: ./apps/portal
      args:
        NEXT_PUBLIC_URL_PORTAL: ${NEXT_PUBLIC_URL_PORTAL}
        NEXT_PUBLIC_URL_PAINEL: ${NEXT_PUBLIC_URL_PAINEL}
        NEXT_PUBLIC_URL_RH: ${NEXT_PUBLIC_URL_RH}
        NEXT_PUBLIC_URL_ESTOQUE: ${NEXT_PUBLIC_URL_ESTOQUE}
        NEXT_PUBLIC_URL_PROGRAMACAO: ${NEXT_PUBLIC_URL_PROGRAMACAO}
        NEXT_PUBLIC_URL_ALOJAMENTOS: ${NEXT_PUBLIC_URL_ALOJAMENTOS}
        NEXT_PUBLIC_URL_FROTA: ${NEXT_PUBLIC_URL_FROTA}
    env_file: ./apps/portal/.env.production
    volumes:
      - portal_data:/app/data
    restart: unless-stopped
    networks: [csc]

  painel-locacao:
    build:
      context: ./apps/painel-locacao
      args:
        NEXT_PUBLIC_URL_PORTAL: ${NEXT_PUBLIC_URL_PORTAL}
        NEXT_PUBLIC_URL_PAINEL: ${NEXT_PUBLIC_URL_PAINEL}
        NEXT_PUBLIC_URL_RH: ${NEXT_PUBLIC_URL_RH}
        NEXT_PUBLIC_URL_ESTOQUE: ${NEXT_PUBLIC_URL_ESTOQUE}
        NEXT_PUBLIC_URL_PROGRAMACAO: ${NEXT_PUBLIC_URL_PROGRAMACAO}
        NEXT_PUBLIC_URL_ALOJAMENTOS: ${NEXT_PUBLIC_URL_ALOJAMENTOS}
        NEXT_PUBLIC_URL_FROTA: ${NEXT_PUBLIC_URL_FROTA}
    env_file: ./apps/painel-locacao/.env.production
    volumes:
      - painel_locacao_data:/app/data
    restart: unless-stopped
    networks: [csc]

  rh:
    build:
      context: ./apps/rh
      args:
        NEXT_PUBLIC_URL_PORTAL: ${NEXT_PUBLIC_URL_PORTAL}
        NEXT_PUBLIC_URL_PAINEL: ${NEXT_PUBLIC_URL_PAINEL}
        NEXT_PUBLIC_URL_RH: ${NEXT_PUBLIC_URL_RH}
        NEXT_PUBLIC_URL_ESTOQUE: ${NEXT_PUBLIC_URL_ESTOQUE}
        NEXT_PUBLIC_URL_PROGRAMACAO: ${NEXT_PUBLIC_URL_PROGRAMACAO}
        NEXT_PUBLIC_URL_ALOJAMENTOS: ${NEXT_PUBLIC_URL_ALOJAMENTOS}
        NEXT_PUBLIC_URL_FROTA: ${NEXT_PUBLIC_URL_FROTA}
    env_file: ./apps/rh/.env.production
    volumes:
      - rh_data:/app/data
    restart: unless-stopped
    networks: [csc]

  estoque:
    build:
      context: ./apps/estoque
      args:
        NEXT_PUBLIC_URL_PORTAL: ${NEXT_PUBLIC_URL_PORTAL}
        NEXT_PUBLIC_URL_PAINEL: ${NEXT_PUBLIC_URL_PAINEL}
        NEXT_PUBLIC_URL_RH: ${NEXT_PUBLIC_URL_RH}
        NEXT_PUBLIC_URL_ESTOQUE: ${NEXT_PUBLIC_URL_ESTOQUE}
        NEXT_PUBLIC_URL_PROGRAMACAO: ${NEXT_PUBLIC_URL_PROGRAMACAO}
        NEXT_PUBLIC_URL_ALOJAMENTOS: ${NEXT_PUBLIC_URL_ALOJAMENTOS}
        NEXT_PUBLIC_URL_FROTA: ${NEXT_PUBLIC_URL_FROTA}
    env_file: ./apps/estoque/.env.production
    volumes:
      - estoque_data:/app/data
    restart: unless-stopped
    depends_on: [rh]
    networks: [csc]

  programacao:
    build:
      context: ./apps/programacao
      args:
        NEXT_PUBLIC_URL_PORTAL: ${NEXT_PUBLIC_URL_PORTAL}
        NEXT_PUBLIC_URL_PAINEL: ${NEXT_PUBLIC_URL_PAINEL}
        NEXT_PUBLIC_URL_RH: ${NEXT_PUBLIC_URL_RH}
        NEXT_PUBLIC_URL_ESTOQUE: ${NEXT_PUBLIC_URL_ESTOQUE}
        NEXT_PUBLIC_URL_PROGRAMACAO: ${NEXT_PUBLIC_URL_PROGRAMACAO}
        NEXT_PUBLIC_URL_ALOJAMENTOS: ${NEXT_PUBLIC_URL_ALOJAMENTOS}
        NEXT_PUBLIC_URL_FROTA: ${NEXT_PUBLIC_URL_FROTA}
    env_file: ./apps/programacao/.env.production
    volumes:
      - programacao_data:/app/data
    restart: unless-stopped
    networks: [csc]

  alojamentos:
    build:
      context: ./apps/alojamentos
      args:
        NEXT_PUBLIC_URL_PORTAL: ${NEXT_PUBLIC_URL_PORTAL}
        NEXT_PUBLIC_URL_PAINEL: ${NEXT_PUBLIC_URL_PAINEL}
        NEXT_PUBLIC_URL_RH: ${NEXT_PUBLIC_URL_RH}
        NEXT_PUBLIC_URL_ESTOQUE: ${NEXT_PUBLIC_URL_ESTOQUE}
        NEXT_PUBLIC_URL_PROGRAMACAO: ${NEXT_PUBLIC_URL_PROGRAMACAO}
        NEXT_PUBLIC_URL_ALOJAMENTOS: ${NEXT_PUBLIC_URL_ALOJAMENTOS}
        NEXT_PUBLIC_URL_FROTA: ${NEXT_PUBLIC_URL_FROTA}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
    env_file: ./apps/alojamentos/.env.production
    volumes:
      - alojamentos_data:/app/data
    restart: unless-stopped
    depends_on: [whatsapp, rh]
    networks: [csc]

  frota:
    build:
      context: ./apps/frota
    env_file: ./apps/frota/.env.production
    volumes:
      - frota_dados:/app/dados
      - frota_anexos:/app/.next/standalone/public/anexos
    restart: unless-stopped
    networks: [csc]

  whatsapp:
    build:
      context: ./apps/whatsapp
    env_file: ./apps/whatsapp/.env.production
    volumes:
      - whatsapp_sessao:/app/sessao
    restart: unless-stopped
    networks: [csc]

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - portal
      - painel-locacao
      - rh
      - estoque
      - programacao
      - alojamentos
      - frota
    ports:
      - "80:80"
      - "3000:3000"
      - "3002:3002"
      - "3003:3003"
      - "3004:3004"
      - "3005:3005"
      - "3007:3007"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    restart: unless-stopped
    networks: [csc]

networks:
  csc:
    driver: bridge

volumes:
  portal_data:
  painel_locacao_data:
  rh_data:
  estoque_data:
  programacao_data:
  alojamentos_data:
  frota_dados:
  frota_anexos:
  whatsapp_sessao:
